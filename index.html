<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Virtual Piano</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Virtual Piano</h1>
        </header>
        <main>
            <div class="button-container" role="group" aria-label="Octave range">
                <button type="button" onclick="renderPiano(1)">1 Octave Piano</button>
                <button type="button" onclick="renderPiano(3)">3 Octave Piano</button>
            </div>
            <p id="piano-status" class="status" role="status">Loading piano samples…</p>
            <div id="piano" class="piano-container" role="group" aria-label="Piano keys"></div>
        </main>
        <footer class="footer">
            <p>Virtual Piano by Jerzy Dziubel | <a href="https://github.com/George2Times/piano">GitHub Repo</a></p>
        </footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.34/Tone.min.js"
            integrity="sha512-dPlIGcMEoXlx8VrY3DgPTVu9GyUorVTFZRUlZl6COj1TXeNSLDwTMuaFxsxKV0Xga9yQJ3ZXaYDE6G6amX3BwA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>
    <script src="piano-logic.js"></script>
    <script src="script.js"></script>
</body>
</html>
